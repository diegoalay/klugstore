    <!--
      Respaldo CSR (csr.html: /admin y productos sin página pre-generada). En SSG sin PWA,
      Quasar asume que toda página viene pre-renderizada y el plugin Meta hace
      document.getElementById('qmeta-init').remove(): sin ese nodo la app revienta antes
      de montarse y la página queda en blanco. Las páginas pre-renderizadas ya traen
      data-server-rendered y su propio #qmeta-init, así que ahí no se toca nada.
    -->
    <script>
      if (document.body.getAttribute('data-server-rendered') === null && !document.getElementById('qmeta-init')) {
        window.__Q_META__ = { title: '', titleTemplate: null, meta: {}, link: {}, script: {}, htmlAttr: {}, bodyAttr: {} }
        var qmeta = document.createElement('script')
        qmeta.id = 'qmeta-init'
        document.body.appendChild(qmeta)
      }
    </script>
